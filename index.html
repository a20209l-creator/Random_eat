<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>隨機食光 - 今天吃什麼？</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-50 min-h-screen flex flex-col items-center justify-between text-slate-800">

    <!-- 頂部標題 -->
    <header class="w-full bg-white shadow-sm py-4 px-6 text-center">
        <h1 class="text-2xl font-bold text-orange-500">🍽️ 隨機食光 Random Eat</h1>
        <p class="text-xs text-slate-400 mt-1">選擇障礙的救星，探索附近真實存在的餐飲店家！</p>
    </header>

    <!-- 主要內容區 -->
    <main class="w-full max-w-md p-4 flex-1 flex flex-col gap-4">
        
        <!-- 定位與範圍設定卡片 -->
        <div class="bg-white p-4 rounded-2xl shadow-sm border border-slate-100 flex flex-col gap-3">
            <div class="flex items-center justify-between">
                <span class="text-sm font-medium text-slate-500">位置與範圍設定</span>
                <button onclick="getLocation()" class="text-xs bg-orange-50 text-orange-600 px-3 py-1.5 rounded-full font-medium hover:bg-orange-100 transition">重新自動定位</button>
            </div>
            
            <div id="status-text" class="text-sm text-slate-700 bg-slate-50 p-3 rounded-xl">
                正在取得您的所在位置...
            </div>

            <!-- 手動輸入地址備用方案 -->
            <div class="flex gap-2 pt-1">
                <input type="text" id="manual-location" placeholder="或輸入地標/路名 (例: 高雄火車站)" class="flex-1 text-xs bg-slate-100 border border-slate-200 rounded-lg px-3 py-2 text-slate-700 focus:outline-none focus:border-orange-500">
                <button onclick="searchByManualLocation()" class="text-xs bg-slate-800 text-white px-3 py-2 rounded-lg font-medium hover:bg-slate-700 transition">搜尋</button>
            </div>

            <!-- 搜尋距離選單 -->
            <div class="flex items-center justify-between pt-1 border-t border-slate-100 mt-1">
                <label for="radius-select" class="text-xs font-medium text-slate-500">搜尋範圍上限：</label>
                <select id="radius-select" onchange="fetchNearbyRestaurants()" class="text-xs bg-slate-100 border border-slate-200 rounded-lg px-3 py-1.5 text-slate-700 focus:outline-none focus:border-orange-500">
                    <option value="1000">1 公里以內</option>
                    <option value="2000" selected>2 公里以內</option>
                    <option value="3000">3 公里以內</option>
                    <option value="5000">5 公里以內</option>
                </select>
            </div>
        </div>

        <!-- 抽獎/決定區 -->
        <div class="bg-white p-6 rounded-2xl shadow-sm border border-slate-100 flex flex-col items-center text-center gap-4">
            <div id="roulette-box" class="w-full py-8 bg-gradient-to-br from-orange-400 to-amber-500 rounded-2xl text-white shadow-inner flex flex-col items-center justify-center min-h-[140px] px-4 transition-all duration-300">
                <span id="result-title" class="text-sm opacity-90">準備好了嗎？</span>
                <h2 id="result-name" class="text-xl font-bold mt-1">點擊下方按鈕抽美食！</h2>
            </div>

            <button id="draw-btn" onclick="startRoulette()" disabled class="w-full py-3.5 bg-slate-200 text-slate-400 font-bold rounded-xl shadow-md transition-all cursor-not-allowed">
                🎲 開始隨機抽獎
            </button>
            
            <div id="nav-container" class="w-full hidden">
                <a id="nav-link" href="#" target="_blank" class="w-full py-3 bg-emerald-500 hover:bg-emerald-600 text-white font-bold rounded-xl shadow-md flex items-center justify-center gap-2 transition">
                    📍 開啟 Google 地圖導航
                </a>
            </div>
        </div>

        <!-- 附近的真實餐廳清單 -->
        <div class="bg-white p-4 rounded-2xl shadow-sm border border-slate-100 flex flex-col gap-3">
            <div class="flex items-center justify-between">
                <span class="text-sm font-medium text-slate-500">附近真實店家清單</span>
                <span id="restaurant-count" class="text-xs bg-slate-100 text-slate-600 px-2 py-1 rounded-md">0 家</span>
            </div>
            <div id="restaurant-list" class="flex flex-col gap-2 max-h-48 overflow-y-auto pr-1">
                <p class="text-xs text-slate-400 text-center py-4">定位完成後將自動搜尋附近真實店家...</p>
            </div>
        </div>

    </main>

    <!-- 頁尾 -->
    <footer class="py-4 text-xs text-slate-400">
        Random_eat &copy; 2026
    </footer>

    <!-- JavaScript 邏輯 -->
    <script>
        let currentLat = 22.6273; 
        let currentLng = 120.3014; 
        let restaurants = [];

        window.onload = function() {
            getLocation();
        };

        // 1. GPS 定位
        function getLocation() {
            const statusText = document.getElementById('status-text');
            statusText.innerHTML = "📡 正在讀取 GPS 定位...";
            
            if (!navigator.geolocation) {
                statusText.innerHTML = "❌ 瀏覽器不支援定位，請使用手動輸入";
                setNoRestaurantState("瀏覽器不支援地理定位");
                return;
            }

            navigator.geolocation.getCurrentPosition(
                (position) => {
                    currentLat = position.coords.latitude;
                    currentLng = position.coords.longitude;
                    statusText.innerHTML = `✅ GPS 定位成功<br><span class="text-xs text-slate-400">緯度: ${currentLat.toFixed(4)}, 經度: ${currentLng.toFixed(4)}</span>`;
                    fetchNearbyRestaurants();
                },
                (error) => {
                    let errorMsg = "定位失敗";
                    if (error.code === error.PERMISSION_DENIED) errorMsg = "使用者拒絕定位權限";
                    else if (error.code === error.POSITION_UNAVAILABLE) errorMsg = "位置資訊不可用";
                    else if (error.code === error.TIMEOUT) errorMsg = "定位逾時";
                    
                    statusText.innerHTML = `⚠️ ${errorMsg}。請使用下方「手動輸入地標」。`;
                    setNoRestaurantState(errorMsg);
                },
                { timeout: 10000, maximumAge: 60000, enableHighAccuracy: true }
            );
        }

        // 2. 手動地點搜尋 (Nominatim API)
        async function searchByManualLocation() {
            const keyword = document.getElementById('manual-location').value.trim();
            const statusText = document.getElementById('status-text');
            
            if (!keyword) {
                alert('請輸入欲查詢的地標或路名！');
                return;
            }

            statusText.innerHTML = `🔍 正在搜尋「${keyword}」的位置...`;

            try {
                const response = await fetch(`https://nominatim.openstreetmap.org/search?format=json&q=${encodeURIComponent(keyword)}`);
                const data = await response.json();

                if (data && data.length > 0) {
                    currentLat = parseFloat(data[0].lat);
                    currentLng = parseFloat(data[0].lon);
                    statusText.innerHTML = `✅ 已切換至：${data[0].display_name.substring(0, 30)}...`;
                    fetchNearbyRestaurants();
                } else {
                    statusText.innerHTML = `❌ 找不到「${keyword}」的地點。`;
                    setNoRestaurantState("找不到指定地點");
                }
            } catch (e) {
                statusText.innerHTML = `⚠️ 地點搜尋暫時失敗。`;
                setErrorState("地點搜尋暫時失敗");
            }
        }

        // 3. 計算兩點距離 (Haversine formula) 單位: 公里
        function calculateDistance(lat1, lon1, lat2, lon2) {
            const R = 6371; 
            const dLat = (lat2 - lat1) * Math.PI / 180;
            const dLon = (lon2 - lon1) * Math.PI / 180;
            const a = 
                Math.sin(dLat/2) * Math.sin(dLat/2) +
                Math.cos(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) * 
                Math.sin(dLon/2) * Math.sin(dLon/2);
            const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
            return R * c;
        }

        // 4. 抓取真實餐廳資料 (Overpass API)
        async function fetchNearbyRestaurants() {
            const listContainer = document.getElementById('restaurant-list');
            listContainer.innerHTML = '<p class="text-xs text-slate-400 text-center py-4">🔍 正在從 OpenStreetMap 查詢附近真實餐飲店家...</p>';

            const radiusMeters = parseInt(document.getElementById('radius-select').value); 
            const radiusKm = radiusMeters / 1000;

            // 擴大餐飲標籤：restaurant, fast_food, cafe, food_court, ice_cream, bakery
            const query = `[out:json][timeout:20];(
                node["amenity"~"restaurant|fast_food|cafe|food_court|ice_cream|bakery"](around:${radiusMeters},${currentLat},${currentLng});
                way["amenity"~"restaurant|fast_food|cafe|food_court|ice_cream|bakery"](around:${radiusMeters},${currentLat},${currentLng});
            );out body geom;`;
            
            const targetUrl = `https://overpass.kumi.systems/api/interpreter?data=${encodeURIComponent(query)}`;
            const url = `https://corsproxy.io/?${encodeURIComponent(targetUrl)}`;

            try {
                const response = await fetch(url);
                
                if (!response.ok) {
                    throw new Error(`伺服器回應異常 (狀態碼: ${response.status})`);
                }

                const data = await response.json();
                
                // 過濾掉過短或純屬統稱的無效店名
                const genericNames = ["餐廳", "小吃", "速食", "飮食店", "便當", "水煮餐", "健康餐盒", "飮品", "飮料店", "restaurant", "food", "cafe", "bakery"];

                let rawRestaurants = [];

                if (data.elements && data.elements.length > 0) {
                    data.elements.forEach(item => {
                        if (!item.tags || !item.tags.name) return;
                        
                        const name = item.tags.name.trim();
                        const lowerName = name.toLowerCase();
                        if (name.length <= 1 || genericNames.includes(lowerName)) return;

                        // 取得真實座標 (Node 取 lat/lon，Way 取 center 或 geometry 中心)
                        let itemLat = item.lat;
                        let itemLon = item.lon;
                        if (!itemLat && item.center) {
                            itemLat = item.center.lat;
                            itemLon = item.center.lon;
                        } else if (!itemLat && item.geometry && item.geometry.length > 0) {
                            // 計算 geometry 的平均中心點作為 way 的座標
                            let sumLat = 0, sumLon = 0;
                            item.geometry.forEach(g => { sumLat += g.lat; sumLon += g.lon; });
                            itemLat = sumLat / item.geometry.length;
                            itemLon = sumLon / item.geometry.length;
                        }

                        if (!itemLat || !itemLon) return;

                        const dist = calculateDistance(currentLat, currentLng, itemLat, itemLon);

                        // 嚴格過濾距離小於等於選擇範圍的店家
                        if (dist <= radiusKm) {
                            rawRestaurants.push({
                                id: item.id,
                                name: name,
                                lat: itemLat,
                                lon: itemLon,
                                type: item.tags.cuisine || item.tags.amenity || '餐飲',
                                address: item.tags["addr:full"] || item.tags["addr:street"] || "",
                                phone: item.tags.phone || item.tags["contact:phone"] || "",
                                website: item.tags.website || item.tags["contact:website"] || "",
                                opening_hours: item.tags.opening_hours || "",
                                distance: dist
                            });
                        }
                    });
                }

                // 智慧去重機制：結合 OSM id 與「名稱 + 座標距離（小於 30 公尺視為同一家）」避免重複
                let uniqueMap = new Map();
                rawRestaurants.forEach(r => {
                    // 檢查是否有極近距離且同名的重複項目
                    let isDuplicate = false;
                    for (let [existingId, existingR] of uniqueMap.entries()) {
                        const nameMatch = existingR.name === r.name;
                        const distBetween = calculateDistance(existingR.lat, existingR.lon, r.lat, r.lon);
                        if (nameMatch && distBetween < 0.03) { // 30公尺內同名視為重複
                            isDuplicate = true;
                            break;
                        }
                    }
                    if (!uniqueMap.has(r.id) && !isDuplicate) {
                        uniqueMap.set(r.id, r);
                    }
                });

                restaurants = Array.from(uniqueMap.values());

                // 依距離由近到遠排序
                restaurants.sort((a, b) => a.distance - b.distance);

                // 狀態分流處理 (0家, 1家, 2家以上)
                if (restaurants.length === 0) {
                    setNoRestaurantState("附近沒有找到符合條件的餐廳");
                } else {
                    renderRestaurants();
                }

            } catch (e) {
                console.warn("Overpass API 查詢失敗:", e.message);
                setErrorState("餐廳搜尋暫時失敗，請重新搜尋");
            }
        }

        // 5. 渲染餐廳清單與更新抽獎狀態
        function renderRestaurants() {
            const listContainer = document.getElementById('restaurant-list');
            const countTag = document.getElementById('restaurant-count');
            const drawBtn = document.getElementById('draw-btn');

            countTag.innerText = `${restaurants.length} 家`;
            listContainer.innerHTML = '';

            restaurants.forEach((r, index) => {
                const distStr = r.distance < 1 ? `${Math.round(r.distance * 1000)} 公尺` : `${r.distance.toFixed(1)} 公里`;
                
                // 組裝額外詳細資訊（若 OSM 有提供）
                let extraInfo = '';
                if (r.address) extraInfo += `<span class="block text-[10px] text-slate-400">地址: ${r.address}</span>`;
                if (r.opening_hours) extraInfo += `<span class="block text-[10px] text-slate-400">營業時間: ${r.opening_hours}</span>`;
                if (r.phone) extraInfo += `<span class="block text-[10px] text-slate-400">電話: ${r.phone}</span>`;

                listContainer.innerHTML += `
                    <div class="flex flex-col bg-slate-50 px-3 py-2 rounded-xl text-xs gap-1">
                        <div class="flex items-center justify-between">
                            <span class="font-bold text-slate-700">${index + 1}. ${r.name}</span>
                            <span class="text-orange-600 font-medium bg-orange-50 px-2 py-0.5 rounded">${distStr}</span>
                        </div>
                        <div class="flex items-center justify-between text-slate-500">
                            <span>類型：${r.type}</span>
                        </div>
                        ${extraInfo}
                    </div>
                `;
            });

            // 只要有 1 家或以上，就允許抽獎（符合 1 家可抽、多家中選規則）
            if (restaurants.length > 0) {
                drawBtn.disabled = false;
                drawBtn.classList.remove('bg-slate-200', 'text-slate-400', 'cursor-not-allowed');
                drawBtn.classList.add('bg-orange-500', 'hover:bg-orange-600', 'text-white', 'shadow-lg');
            }
        }

        // 6. 查無餐廳狀態
        function setNoRestaurantState(msg) {
            restaurants = [];
            const listContainer = document.getElementById('restaurant-list');
            const countTag = document.getElementById('restaurant-count');
            const drawBtn = document.getElementById('draw-btn');
            const resultName = document.getElementById('result-name');
            const resultTitle = document.getElementById('result-title');
            const navContainer = document.getElementById('nav-container');

            countTag.innerText = "0 家";
            listContainer.innerHTML = `<p class="text-xs text-rose-500 text-center py-4">⚠️ ${msg}</p>`;
            
            drawBtn.disabled = true;
            drawBtn.classList.add('bg-slate-200', 'text-slate-400', 'cursor-not-allowed');
            drawBtn.classList.remove('bg-orange-500', 'hover:bg-orange-600', 'text-white', 'shadow-lg');

            resultTitle.innerText = "無法抽獎";
            resultName.innerText = "附近沒有找到餐廳";
            navContainer.classList.add('hidden');
        }

        // 7. API 錯誤狀態
        function setErrorState(msg) {
            restaurants = [];
            const listContainer = document.getElementById('restaurant-list');
            const countTag = document.getElementById('restaurant-count');
            const drawBtn = document.getElementById('draw-btn');
            const resultName = document.getElementById('result-name');
            const resultTitle = document.getElementById('result-title');
            const navContainer = document.getElementById('nav-container');

            countTag.innerText = "0 家";
            listContainer.innerHTML = `<p class="text-xs text-rose-500 text-center py-4">❌ ${msg}</p>`;
            
            drawBtn.disabled = true;
            drawBtn.classList.add('bg-slate-200', 'text-slate-400', 'cursor-not-allowed');
            drawBtn.classList.remove('bg-orange-500', 'hover:bg-orange-600', 'text-white', 'shadow-lg');

            resultTitle.innerText = "系統提示";
            resultName.innerText = msg;
            navContainer.classList.add('hidden');
        }

        // 8. 隨機抽獎與導航設定
        function startRoulette() {
            if (restaurants.length === 0) return;

            const drawBtn = document.getElementById('draw-btn');
            const resultName = document.getElementById('result-name');
            const resultTitle = document.getElementById('result-title');
            const rouletteBox = document.getElementById('roulette-box');
            const navContainer = document.getElementById('nav-container');

            drawBtn.disabled = true;
            navContainer.classList.add('hidden');
            resultTitle.innerText = "🎲 命運轉動中...";
            
            let counter = 0;
            const totalSteps = 20; 
            let speed = 50;

            function shuffleAnimation() {
                const randomIndex = Math.floor(Math.random() * restaurants.length);
                resultName.innerText = restaurants[randomIndex].name;
                rouletteBox.classList.add('scale-105');
                setTimeout(() => rouletteBox.classList.remove('scale-105'), 50);

                counter++;
                if (counter < totalSteps) {
                    speed += 15; 
                    setTimeout(shuffleAnimation, speed);
                } else {
                    const finalIndex = Math.floor(Math.random() * restaurants.length);
                    const chosen = restaurants[finalIndex];
                    
                    resultTitle.innerText = "🎉 今天決定吃這家！";
                    resultName.innerText = `${chosen.name} (${chosen.distance < 1 ? Math.round(chosen.distance * 1000) + '公尺' : chosen.distance.toFixed(1) + '公里'})`;
                    drawBtn.disabled = false;
                    drawBtn.innerText = "🎲 再抽一次";

                    // 升級 Google Maps 導航連結：同時帶入「餐廳名稱 + 經緯度座標」確保高精準定位
                    const navLink = document.getElementById('nav-link');
                    navLink.href = `https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(chosen.name)}&query_place_id=&center=${chosen.lat},${chosen.lon}`;
                    navContainer.classList.remove('hidden');
                }
            }

            shuffleAnimation();
        }
    </script>
</body>
</html>
